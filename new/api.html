<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <style>
      .card {
        background-color: rgb(232, 255, 252);
        
      }

      .btn-primary {
        margin-top: auto;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div>

    <div class="container">
        <div class="row g-3 mt-3" id="cardsProducts">
        </div>
    </div>

    <script>
    fetch("https://dummyjson.com/products")
    .then(res => {
      console.log(res)
      if(res.ok){
        return res.json()
      }
      else{
        throw new Error("Error")
      }
    })
    .then(data => {
        console.log(data);
        showProducts(data.products);
    })
    .catch(err => {
     console.log(err)
    })

    function showProducts(cardData) {
     let cardsProducts = document.getElementById("cardsProducts");

        if (cardsProducts) {
            cardData.forEach(function (item) {
                cardsProducts.innerHTML +=
                    `<div class="col-12 col-md-6 col-lg-3">
                        <div class="card h-100 ">
  <img src="${item.thumbnail}" class="card-img-top" alt="...">
  <div class="card-body  d-flex flex-column">
    <h5 class="card-title">${item.title}</h5>
    <p class="card-text">${item.description}</p>
    <a href="#" class="btn btn-primary mt-auto mb-0">View Details</a>
  </div>
</div>
</div>`
            });
        }}
        

</script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

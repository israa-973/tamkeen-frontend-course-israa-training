<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuisine restaurant</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
<div class="site-header d-flex">
    <div class="logo d-flex">
        <a href="#"><img src="assets/images/logo.png" alt="logo"/></a>
        <a href="#"><img src="assets/images/AUTHENTIC cuisine restaurant.png" alt=""/></a>
    </div>
    <div class="search-bar d-flex">
        <input type="text" placeholder="Search"/>
        <img src="assets/images/Search.png" alt="search"/>
    </div>
    <div class="menu d-flex">
        <ul class="d-flex">
            <li><a href="#">Today’s Special Dish</a></li>
            <li><a href="#">Menu</a></li>
        </ul>
        <div class="cart">
            <a href="#"><img src="assets/images/Cart.png" alt=""></a>
        </div>
    </div>
</div>
    </header>

    <main>
<section class="hero-section">
    <h2 class="hero-title">
        It's not just food, <span>It's an experience.</span>
    </h2>
    <div class="featured-dishes-slider d-flex">
        <div class="dish-card pos-r">
            <div class="dish-image">
                <img src="assets/images/Rectangle 5.png" alt=""/>
            </div>
            <div class="availablity-status pos-a">
                <img class="rectangle" src="assets/images/Rectangle 9.png" alt=""/>
                <img class="ellipse pos-a" src="assets/images/Ellipse 1.png" alt=""/>
            </div>
            <div class="dish-info pos-a">
                <button class="cta-btn"><a href="#">A Plate of Sushi</a>
                </button>
            </div>
        </div>
        <div class="dish-card pos-r">
            <div class="dish-image">
                <img src="assets/images/Rectangle 4.png" alt="">
            </div>
            <div class="availablity-status pos-a"></div>
            <div class="dish-info pos-a"></div>
        </div>
    </div>
</section>
    </main>

    <footer>

    </footer>

</body>

</html>
